# DESCRIPTION: GitLab CI/CD for libRetro (NOT FOR GitLab-proper)
#
# This recipe is consumed by the Libretro buildbot so the EKA2L1 core can be
# distributed through RetroArch's Online Updater > Core Downloader.
#
# Linux x64/aarch64, Android arm64-v8a and macOS arm64/x86_64. The core is
# C++20 (see the top of CMakeLists.txt), which rules out the buildbot's own
# xenial-gcc9 and focal images, so the Linux jobs run on ubuntu:22.04 and pull
# their own toolchain, the way other C++20 cores do. Android builds with the
# NDK the template provides (arm64 only, as upstream's app: dynarmic's x86_64
# backend does not build with the NDK's libc++). Windows is cross-built on
# Linux with llvm-mingw (.ci/build-windows-cross-libretro.sh), as
# rpcs3-libretro is: the buildbot's MSVC 2019 (19.28) is too old for the
# C++20 the emulator uses.

# Core definitions
.core-defs:
  variables:
    CORENAME: eka2l1
    # The libretro core, without the Lua runtime (native patches only) and
    # without the desktop frontends. CMake writes it to <build>/bin.
    CORE_ARGS: -G Ninja -DCI=ON -DEKA2L1_BUILD_LIBRETRO=ON -DEKA2L1_SCRIPTING_LUA=OFF
    EXTRA_PATH: bin
    # EKA2L1 keeps its third-party code in submodules.
    GIT_SUBMODULE_STRATEGY: recursive

# The buildbot's images predate C++20, so both jobs bring their own compiler.
# Overriding before_script drops the template's NUMPROC, hence the re-export.
.core-deps:
  image: ubuntu:22.04
  before_script:
    - export NUMPROC=$(($(nproc)/5))
    - export NUMPROC=$((NUMPROC > 0 ? NUMPROC : 1))
    - apt-get update -qq
    - DEBIAN_FRONTEND=noninteractive apt-get install -yqq
        build-essential cmake ninja-build git ca-certificates
        libgtk-3-dev libpulse-dev libasound2-dev

include:
  ################################## DESKTOP ##################################
  # Linux
  - project: 'libretro-infrastructure/ci-templates'
    file: '/linux-cmake.yml'

  # Windows
  - project: 'libretro-infrastructure/ci-templates'
    file: '/windows-cmake-mingw.yml'

  # macOS
  - project: 'libretro-infrastructure/ci-templates'
    file: '/osx-cmake-arm64.yml'
  - project: 'libretro-infrastructure/ci-templates'
    file: '/osx-cmake-x86.yml'

  ################################## CELLULAR #################################
  # Android
  - project: 'libretro-infrastructure/ci-templates'
    file: '/android-cmake.yml'

# Stages for building
stages:
  - build-prepare
  - build-shared
  - build-static

##############################################################################
#################################### STAGES ##################################
##############################################################################
#
################################### DESKTOP ##################################
# Linux 64-bit
libretro-build-linux-x64:
  extends:
    - .libretro-linux-cmake-x86_64
    - .core-deps
    - .core-defs

# Linux aarch64 — the architecture the devices this core is aimed at use
libretro-build-linux-aarch64:
  extends:
    - .libretro-linux-cmake-aarch64
    - .core-deps
    - .core-defs

# Windows 64-bit, cross-built with llvm-mingw
libretro-build-windows-x64:
  extends:
    - .libretro-windows-cmake-x86_64
    - .core-defs
  # LLVM 18: later libc++ no longer pulls in the headers the vendored fmt
  # and Boost (and some of EKA2L1) rely on getting transitively
  image: mstorsjo/llvm-mingw:20240619
  variables:
    # The script fetches the submodules itself
    GIT_SUBMODULE_STRATEGY: none
  before_script:
    - export NUMPROC=$(($(nproc)/5))
  script:
    - BUILD_DIR=$BUILD_DIR .ci/build-windows-cross-libretro.sh
    - mv $BUILD_DIR/src/emu/libretro/$LIBNAME $LIBNAME

# macOS: Apple clang and the system's make (no Ninja on those runners), and
# the deployment target the project's own CI uses (std::filesystem and the
# C++20 library need 12.0, the templates default to 10.9/10.15)
.core-defs-osx:
  extends: .core-defs
  variables:
    CORE_ARGS: -DCI=ON -DEKA2L1_BUILD_LIBRETRO=ON -DEKA2L1_SCRIPTING_LUA=OFF
    MACOSX_DEPLOYMENT_TARGET: "12.0"

# macOS 64-bit (ARM)
libretro-build-osx-arm64:
  extends:
    - .libretro-osx-cmake-arm64
    - .core-defs-osx

# macOS 64-bit (Intel)
libretro-build-osx-x64:
  extends:
    - .libretro-osx-cmake-x86_64
    - .core-defs-osx

################################### CELLULAR #################################
# Android 64-bit (ARM)
android-arm64-v8a:
  extends:
    - .libretro-android-cmake-arm64-v8a
    - .core-defs
  variables:
    API_LEVEL: 28

# The libretro core for Linux, Windows, macOS and Android, built with the
# same CMake tree as upstream's apps; FFmpeg is built from its submodule as
# upstream does.
name: libretro core

on:
  push:
    branches: [libretro]
  workflow_dispatch:

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # GCC 13 for the C++20 the emulator is written in; Ubuntu 22.04 for an
      # older glibc
      - name: Dependencies
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get -y install build-essential gcc-13 g++-13 ninja-build libc6-dev \
            libgtk-3-dev libpulse-dev libasound2-dev nasm
          pip install --upgrade cmake

      - name: Build
        env:
          CC: gcc-13
          CXX: g++-13
        run: |
          cmake -B build -G Ninja -DCI=ON -DCMAKE_BUILD_TYPE=Release -DEKA2L1_SCRIPTING_LUA=OFF
          cmake --build build --parallel 4 --target eka2l1_libretro

      - name: Collect
        run: |
          mkdir -p dist
          cp build/bin/eka2l1_libretro.so dist/
          strip --strip-unneeded dist/eka2l1_libretro.so
          readelf -d dist/eka2l1_libretro.so | grep NEEDED
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: eka2l1_libretro-linux-${{ matrix.arch }}
          path: dist/

  windows:
    name: Windows x86_64
    runs-on: windows-2022
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      # FFmpeg's configure and make, which the build runs, through MSYS2
      - name: FFmpeg build tools
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          install: make

      - name: Build
        run: |
          cmake -B build -DCI=ON -DEKA2L1_SCRIPTING_LUA=OFF -DCMAKE_BUILD_TYPE=Release `
            -DEKA2L1_FFMPEG_BASH="${{ steps.msys2.outputs.msys2-location }}/usr/bin/bash.exe" `
            -DEKA2L1_FFMPEG_MAKE="${{ steps.msys2.outputs.msys2-location }}/usr/bin/make.exe"
          cmake --build build --config Release --parallel 4 --target eka2l1_libretro

      - name: Collect
        shell: bash
        run: |
          mkdir -p dist
          cp "$(find build -name eka2l1_libretro.dll | head -1)" dist/
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: eka2l1_libretro-windows-x86_64
          path: dist/

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    env:
      MACOSX_DEPLOYMENT_TARGET: 12.0
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build
        run: |
          brew install ninja nasm
          cmake -B build -G Ninja -DCI=ON -DCMAKE_BUILD_TYPE=Release -DEKA2L1_SCRIPTING_LUA=OFF
          cmake --build build --parallel 4 --target eka2l1_libretro

      - name: Collect
        run: |
          mkdir -p dist
          cp build/bin/eka2l1_libretro.dylib dist/
          strip -x dist/eka2l1_libretro.dylib
          codesign -f -s - dist/eka2l1_libretro.dylib
          otool -L dist/eka2l1_libretro.dylib
          lipo -info dist/eka2l1_libretro.dylib

      - uses: actions/upload-artifact@v4
        with:
          name: eka2l1_libretro-macos-${{ matrix.arch }}
          path: dist/

  android:
    name: Android ${{ matrix.abi }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        # arm64 only, as upstream's Android app: dynarmic's x86_64 backend does
        # not build with the NDK's libc++
        abi: [arm64-v8a]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Build
        run: |
          sudo apt-get update
          sudo apt-get -y install ninja-build nasm
          cmake -B build -G Ninja -DCI=ON -DCMAKE_BUILD_TYPE=Release -DEKA2L1_SCRIPTING_LUA=OFF \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=${{ matrix.abi }} -DANDROID_PLATFORM=android-28 -DANDROID_STL=c++_static \
            -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON
          cmake --build build --parallel 4 --target eka2l1_libretro

      - name: Collect
        run: |
          mkdir -p dist
          cp build/bin/eka2l1_libretro_android.so dist/
          $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip --strip-unneeded dist/eka2l1_libretro_android.so
          $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf -d dist/eka2l1_libretro_android.so | grep NEEDED
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: eka2l1_libretro-android-${{ matrix.abi }}
          path: dist/
